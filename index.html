<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dominoki — Видеореференсы</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--primary:#F6269A;--primary-btn:#E21B88;--primary-text:#FFFFFF;--primary-soft:#FDF2F8;--primary-plum:#8C0F5D;--ring-blue:#B4BCE4;--bg:#F6F7FB;--surface:#FFFFFF;--text:#18181B;--muted:#71717A;--border:#E4E4E7;--pending:#F59E0B;--pending-bg:#FEF3C7;--done:#10B981;--done-bg:#D1FAE5;--danger:#EF4444;--radius:14px;}{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.4;touch-action:manipulation;}.app{max-width:520px;margin:0
auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;padding-bottom:24px;}.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:2px
solid
var(--primary);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;}.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;min-width:0;}.brand>div:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}.brand-logo{width:28px;height:28px;border-radius:50%;background:#FFFFFF;border:2px
solid var(--primary-plum);box-shadow:0 0 0 3px
var(--ring-blue);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--primary);letter-spacing:-0.5px;flex-shrink:0;}.header-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}.refresh-btn{width:32px;height:32px;border-radius:50%;border:1px
solid
var(--border);background:var(--surface);cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;}.role-btn{font-size:12px;font-weight:600;padding:6px 10px;border-radius:20px;border:1px
solid
var(--border);background:var(--surface);cursor:pointer;}.role-btn.admin{background:var(--primary-btn);color:var(--primary-text);border-color:var(--primary-btn);}.section{padding:12px 16px 0;}.search-row{display:flex;gap:8px;margin-bottom:12px;}.input{width:100%;padding:10px 12px;border-radius:12px;border:1px
solid
var(--border);background:var(--surface);font-size:16px;outline:none;}.input:focus{border-color:var(--primary);}.btn{border:none;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform 0.08s
ease,opacity 0.15s;}.btn:active{transform:scale(0.97);}.btn:disabled{opacity:0.6;cursor:not-allowed;}.btn-primary{background:var(--primary-btn);color:var(--primary-text);}.btn-success{background:var(--done);color:#FFFFFF;}.btn-ghost{background:var(--surface);border:1px
solid
var(--border);color:var(--text);}.btn-danger{background:#FEE2E2;color:var(--danger);}.filter-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#E8EAF4;padding:4px;border-radius:12px;margin-bottom:12px;}.filter-tab{border:none;background:transparent;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}.filter-tab.active{background:var(--surface);color:var(--primary-plum);box-shadow:0 1px 3px
rgba(140,15,93,0.12);}.catalog-list{display:flex;flex-direction:column;gap:10px;padding:0 16px;}.card{background:var(--surface);border-radius:var(--radius);border:1px
solid
var(--border);padding:10px;display:flex;gap:12px;cursor:pointer;align-items:center;}.card.is-done{opacity:0.78;}.thumb-wrap{position:relative;width:108px;height:62px;border-radius:9px;overflow:hidden;flex-shrink:0;background:#18181B;}.thumb-wrap
img{width:100%;height:100%;object-fit:cover;}.ref-id-badge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,0.78);color:#FFFFFF;font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;}.card-body{flex:1;min-width:0;}.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:4px;}.card-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.status-pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}.status-pending{background:var(--pending-bg);color:#92400E;}.status-done{background:var(--done-bg);color:#065F46;}.card-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.quick-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:1px
solid
var(--border);scrollbar-width:none;}.quick-tabs::-webkit-scrollbar{display:none;}.q-tab{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;border:1px
solid
var(--border);background:var(--bg);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;}.q-tab.active{background:var(--primary-btn);border-color:var(--primary-btn);color:var(--primary-text);}.q-dot{width:7px;height:7px;border-radius:50%;}.q-dot.pending{background:var(--pending);}.q-dot.done{background:var(--done);}.workspace{padding:12px 16px;display:flex;flex-direction:column;gap:12px;}.ws-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;}.player-box{position:relative;width:100%;aspect-ratio:16/9;background:#000000;border-radius:var(--radius);overflow:hidden;}.player-box
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}.admin-note{background:var(--primary-soft);border-left:3px
solid
var(--primary);color:#500724;padding:10px 12px;border-radius:8px;font-size:13px;}.editor-card{background:var(--surface);border:1px
solid
var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:10px;}.editor-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--muted);}.save-state{font-size:11px;font-weight:600;color:var(--muted);}.comment-area{width:100%;min-height:110px;border:1px
solid
var(--border);border-radius:10px;padding:10px;font-family:inherit;font-size:16px;resize:vertical;outline:none;}.comment-area:focus{border-color:var(--primary);}.tools-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}.icon-btn{height:44px;padding:0 14px;border-radius:12px;border:1px
solid
var(--border);background:var(--bg);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}.icon-btn:disabled{opacity:0.6;cursor:not-allowed;}.icon-btn.recording{background:#FEE2E2;border-color:var(--danger);color:var(--danger);animation:pulse 1.2s
infinite;}@keyframes
pulse{0%,100%{opacity:1;}50%{opacity:0.65;}}.attachments-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}.att-item{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:1px
solid var(--border);background:#FFFFFF;}.att-item
img{width:100%;height:100%;object-fit:cover;display:block;}.att-badge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,0.65);color:#FFFFFF;font-size:10px;padding:2px 5px;border-radius:4px;}.att-del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,0.7);color:#FFFFFF;font-weight:700;cursor:pointer;}.modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;justify-content:center;}.modal-backdrop.open{display:flex;}.modal-sheet{width:100%;max-width:520px;background:var(--surface);border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:92dvh;overflow-y:auto;}.draw-modal{position:fixed;inset:0;z-index:60;background:#18181B;display:none;flex-direction:column;height:100dvh;}.draw-modal.open{display:flex;}.draw-top{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;color:#FFFFFF;gap:8px;}.canvas-wrap{flex:1;margin:0 10px;background:#FFFFFF;border-radius:12px;overflow:hidden;position:relative;}#sketchCanvas{width:100%;height:100%;display:block;touch-action:none;}.draw-bottom{padding:10px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}.colors{display:flex;gap:8px;align-items:center;}.color-dot{width:28px;height:28px;border-radius:50%;border:2px
solid
rgba(255,255,255,0.3);cursor:pointer;}.color-dot.active{border-color:#FFFFFF;transform:scale(1.15);}.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;padding:16px;}.lightbox.open{display:flex;}.lightbox
img{max-width:100%;max-height:90dvh;border-radius:10px;}.hidden{display:none!important;}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18181B;color:#FFFFFF;padding:10px 16px;border-radius:24px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:opacity 0.2s;max-width:90%;text-align:center;}.toast.show{opacity:1;}</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="brand-logo">DM</div>
      <div>Dominoki</div>
    </div>
    <div class="header-actions">
      <button class="role-btn" id="roleBtn" onclick="toggleRole()">Админ</button>
      <button class="btn btn-primary hidden" id="addRefBtn" onclick="openAddModal()">+ Добавить видео</button>
      <button class="btn btn-ghost hidden" id="deleteRefBtn" onclick="deleteCurrentRef()" title="Удалить">Удалить</button>
    </div>
  </header>

  <div class="section">
    <div class="search-row">
      <input class="input" id="searchInput" placeholder="Поиск...">
    </div>
    <div class="filter-tabs">
      <button class="filter-tab" data-filter="pending" onclick="setFilter('pending')">Ожидают <span id="cntPending">(0)</span></button>
      <button class="filter-tab" data-filter="done" onclick="setFilter('done')">Обработано <span id="cntDone">(0)</span></button>
      <button class="filter-tab" data-filter="all" onclick="setFilter('all')">Все <span id="cntAll">(0)</span></button>
    </div>
    <div id="catalogList" class="catalog-list"></div>
  </div>

  <div id="catalogView" style="display:none;"></div>

  <div id="detailView" class="hidden">
    <div class="ws-nav">
      <button onclick="goCatalog()">← Каталог</button>
      <span id="detailIdBadge">#</span>
      <h2 id="detailTitle" style="margin:0;font-size:16px;font-weight:600;"></h2>
    </div>
    <div class="player-box">
      <iframe id="ytPlayer" src="" title="Видео" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div id="adminNoteBox" class="admin-note hidden"></div>
    <div class="editor-card">
      <div class="editor-head"><label class="admin-only hidden" style="display:flex;align-items:center;gap:6px;font-weight:600;">Номер <input id="numInput" class="input" style="width:96px;padding:6px 8px;" placeholder="001" oninput="scheduleNumSave()"></label><span id="saveStateLabel"></span></div>
      <textarea id="commentInput" placeholder="Комментарий / что изменить:" oninput="scheduleSaveDraft()"></textarea>
      <div class="tools-bar">
        <button class="icon-btn" id="micBtn" onclick="toggleSpeech()" title="Голос"><span id="micLabel">🤺 Голос</span></button>
        <input type="file" id="photoInput" accept="image/*" onchange="handleFiles(event)" style="display:none">
        <label class="icon-btn" for="photoInput" title="Фото">📷 Фото</label>
        <button class="icon-btn" onclick="openDrawModal()" title="Набросм">✏️ Наброск</button>
        <button class="btn btn-success" id="completeBtn" onclick="toggleComplete()">✓ Отметить как обработанное</button>
        <button class="btn btn-ghost admin-only hidden" onclick="deleteCurrentRef()" title="Удалить">Удалить референс</button>
      </div>
      <div id="attachmentsGrid" class="attachments-grid"></div>
    </div>
    <div class="quick-tabs" id="quickTabs"></div>
  </div>

  <div id="addModal" class="modal-backdrop">
    <div class="modal-sheet">
      <div style="font-weight:700;font-size:16px;margin-bottom:10px;">Новый видеореференс</div>
      <input id="newUrl" class="input" placeholder="Ссылка на YouTube / Shorts">
      <input id="newNum" class="input" placeholder="Номер (напр. 001)">
      <input id="newTitle" class="input" placeholder="Название">
      <input id="newFolder" class="input" placeholder="Папка (напр. Партия #1)">
      <input id="newAdminNote" class="input" placeholder="Заметка админа">
      <div class="tools-bar" style="margin-top:10px;">
        <button class="btn btn-ghost" onclick="closeAddModal()">Отмена</button>
        <button class="btn btn-primary" id="submitAddBtn" onclick="addReference()">Добавить в каталог</button>
      </div>
    </div>
  </div>

  <div id="drawModal" class="draw-modal">
    <div class="draw-top">
      <span>📷 Добавить рисунок Добавить рисунок</span>
      <button onclick="closeDrawModal()">↻ Отмена</button>
    </div>
    <div class="canvas-wrap"><canvas id="sketchCanvas"></canvas></div>
    <div class="draw-bottom">
      <div class="colors">
        <div class="color-dot" style="background:#EF4444;" data-color="#EF4444" onclick="setColor(this)" title="Красный"></div>
        <div class="color-dot" style="background:#F6269A;" data-color="#F6269A" onclick="setColor(this)" title="Розовый"></div>
        <div class="color-dot" style="background:#8C0F5D;" data-color="#8C0F5D" onclick="setColor(this)" title="Сливо-сливой"></div>
        <div class="color-dot" style="background:#B4BCE4;" data-color="#B4BCE4" onclick="setColor(this)" title="Голубой"></div>
        <div class="color-dot" style="background:#10B981;" data-color="#10B981" onclick="setColor(this)" title="Зеленый"></div>
        <div class="color-dot" style="background:#000000;border:2px solid rgba(0,0,0,0.3);" data-color="#000000" onclick="setColor(this)" title="Черный"></div>
      </div>
      <input type="file" id="sketchBgInput" accept="image/*" onchange="loadSketchBg(event)" style="display:none">
      <label class="icon-btn" for="sketchBgInput" title="Прикрепить рисунковую задних">📷 Фон</label>
      <button class="icon-btn" onclick="undoStroke()">↻ Отмена</button>
      <button class="icon-btn" onclick="clearCanvas()">☒ Очистить</button>
      <button class="btn btn-success" id="saveSketchBtn" onclick="saveSketch()">Прикрепить рисунок</button>
    </div>
  </div>

  <div id="pinModal" class="modal-backdrop">
    <div class="modal-sheet" style="max-width:340px;">
      <div style="font-weight:700;font-size:16px;">Введите ПИН администратора</div>
      <input id="pinInput" class="input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••" onkeydown="if(event.key==='Enter')submitPin()">
      <div class="tools-bar" style="margin-top:6px;">
        <button class="btn btn-ghost" onclick="closePinModal()">Отмена</button>
        <button class="btn btn-primary" onclick="submitPin()">Войти</button>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="">
  </div>

  <div id="toast" class="toast"></div>

  <script>
let refs=[];let
currentFilter='pending';let activeRefId=null;let isAdmin=false;let
pinRequired=true;let
savedPin=localStorage.getItem('dominoki_admin_pin')||'';let draftTimer=null;let numTimer=null;let
mediaRecorder=null;let audioChunks=[];let audioStream=null;let
isRecording=false;let recMaxTimer=null;function escapeHtml(str){return String(str||'').replaceAll('&','&').replaceAll('<','<').replaceAll('>','>').replaceAll(String.fromCharCode(34),'"');}function
showToast(msg){const
el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}function
extractYouTubeId(raw){try{const u=new URL(raw.trim());const
host=u.hostname.replace('www.','').replace('m.','');let
id='';if(host==='youtu.be'){id=u.pathname.split('/').filter(Boolean)[0]||'';}else
if(host==='youtube.com'||host==='music.youtube.com'){if(u.searchParams.get('v')){id=u.searchParams.get('v');}else{const
parts=u.pathname.split('/').filter(Boolean);const
idx=parts.findIndex(p=>['shorts','embed','live','v'].includes(p));if(idx!==-1&&parts[idx+1])id=parts[idx+1];}}id=id.slice(0,11);return id.length===11?id:null;}catch(e){return null;}}async function
loadRefs(silent){try{const res=await fetch('/.netlify/functions/api');const
data=await res.json();if(!res.ok)throw new Error(data.error||'Ошибка\nзагрузки');refs=data.refs||[];pinRequired=Boolean(data.pinRequired);if(activeRefId){const
current=refs.find(r=>r.id===activeRefId);if(current){updateDetailStatusUI(current);renderAttachments(current);renderQuickTabs();}else{goCatalog();}}else{renderCatalog();}if(!silent)showToast('Обновлено');}catch(err){if(!silent)showToast(err.message);}}async function tryVerifyPin(pin){try{const res=await fetch('/.netlify/functions/api?verifyPin=1',{headers:{'x-admin-pin':pin}});const data=await res.json();if(data.ok){savedPin=pin;localStorage.setItem('dominoki_admin_pin',pin);isAdmin=true;applyRoleUI();return true;}return false;}catch(err){showToast('Ошибка проверки ПИН');return false;}}function toggleRole(){if(isAdmin){isAdmin=false;applyRoleUI();return;}if(!pinRequired){isAdmin=true;applyRoleUI();return;}if(savedPin){tryVerifyPin(savedPin).then(ok=>{if(!ok){savedPin='';localStorage.removeItem('dominoki_admin_pin');openPinModal();}});return;}openPinModal();}function openPinModal(){document.getElementById('pinModal').classList.add('open');const inp=document.getElementById('pinInput');inp.value='';setTimeout(function(){inp.focus();},80);}function closePinModal(){document.getElementById('pinModal').classList.remove('open');}async function submitPin(){const inp=document.getElementById('pinInput');const pin=inp.value.trim();if(!pin){showToast('Введите ПИН');return;}const ok=await tryVerifyPin(pin);if(ok){closePinModal();showToast('Режим администратора включён');}else{localStorage.removeItem('dominoki_admin_pin');savedPin='';inp.value='';showToast('Неверный ПИН-код');inp.focus();}}function applyRoleUI(){const
btn=document.getElementById('roleBtn');btn.textContent=isAdmin?'Админ ✓':'Админ';btn.classList.toggle('admin',isAdmin);document.getElementById('addRefBtn').classList.toggle('hidden',!isAdmin);document.getElementById('deleteRefBtn').classList.toggle('hidden',!isAdmin);document.querySelectorAll('.admin-only').forEach(function(el){el.classList.toggle('hidden',!isAdmin);});}function
setFilter(filter){currentFilter=filter;document.querySelectorAll('.filter-tab').forEach(t=>t.classList.toggle('active',t.dataset.filter===filter));renderCatalog();}function
getFilteredRefs(){const
q=document.getElementById('searchInput').value.trim().toLowerCase();return refs.filter(r=>{const
matchStatus=currentFilter==='all'||r.status===currentFilter;const
matchQuery=!q||String(r.id).includes(q)||(r.num||'').toLowerCase().includes(q)||(r.title||'').toLowerCase().includes(q)||(r.folder||'').toLowerCase().includes(q);return matchStatus&&matchQuery;});}function renderCatalog(){const
pendingCount=refs.filter(r=>r.status==='pending').length;const
doneCount=refs.filter(r=>r.status==='done').length;document.getElementById('cntPending').textContent=pendingCount;document.getElementById('cntDone').textContent=doneCount;document.getElementById('cntAll').textContent=refs.length;const
list=getFilteredRefs();const
container=document.getElementById('catalogList');if(!list.length){container.innerHTML=`<div
style='text-align:center;padding:40px 16px;color:var(--muted);'>Здесь пока
пусто</div>`;return;}container.innerHTML=list.map(r=>{const
isDone=r.status==='done';const
hasDraft=!isDone&&((r.comment||'').trim()||(r.attachments&&r.attachments.length));const
statusText=isDone?'Обработано':(hasDraft?'Черновик':'Ждёт разбора');const
statusClass=isDone?'status-done':'status-pending';const
metaParts=[r.folder||'Без папки'];if(r.comment)metaParts.push('💬\n'+r.comment);if(r.attachments&&r.attachments.length)metaParts.push('📎\n'+r.attachments.length);return `<div class='card ${isDone?'is-done':''}'
onclick='openRef(${r.id})'><div class='thumb-wrap'><img
src='https://img.youtube.com/vi/${escapeHtml(r.ytId)}/mqdefault.jpg' alt=''
loading='lazy' /><span class='ref-id-badge'>#${escapeHtml(r.num || r.id)}</span></div><div
class='card-body'><div class='card-top'><div
class='card-title'>${escapeHtml(r.title)}</div><span class='status-pill\n${statusClass}'>${statusText}</span></div><div
class='card-meta'>${escapeHtml(metaParts.join(' •\n'))}</div></div></div>`;}).join('');}async function goCatalog(){await
flushDraft();stopSpeechIfActive();activeRefId=null;document.getElementById('ytPlayer').src='';document.getElementById('detailView').classList.add('hidden');document.getElementById('catalogView').classList.remove('hidden');renderCatalog();}async function openRef(id){if(activeRefId&&activeRefId!==id)await
flushDraft();stopSpeechIfActive();activeRefId=id;const
ref=refs.find(r=>r.id===id);if(!ref)return;document.getElementById('catalogView').classList.add('hidden');document.getElementById('detailView').classList.remove('hidden');renderQuickTabs();document.getElementById('detailIdBadge').textContent='#'+(ref.num||ref.id);document.getElementById('detailTitle').textContent=ref.title;document.getElementById('ytPlayer').src='https://www.youtube.com/embed/'+ref.ytId+'?playsinline=1&rel=0';const
noteBox=document.getElementById('adminNoteBox');if(ref.adminNote){noteBox.textContent='От\nавтора:\n'+ref.adminNote;noteBox.classList.remove('hidden');}else{noteBox.classList.add('hidden');}document.getElementById('commentInput').value=ref.comment||'';document.getElementById('numInput').value=ref.num||'';document.getElementById('saveStateLabel').textContent='';updateDetailStatusUI(ref);renderAttachments(ref);window.scrollTo({top:0,behavior:'instant'});}function
renderQuickTabs(){const
list=getFilteredRefs();document.getElementById('quickTabs').innerHTML=list.map(r=>`<div
class='q-tab ${r.id===activeRefId?'active':''}' onclick='openRef(${r.id})'><span
class='q-dot ${r.status}'></span><span>#${escapeHtml(r.num || r.id)}</span>`).join('');}function
updateDetailStatusUI(ref){const
pill=document.getElementById('detailStatusPill');const
btn=document.getElementById('completeBtn');if(ref.status==='done'){pill.textContent='Обработано';pill.className='status-pill\nstatus-done';btn.textContent='↺ Вернуть в доработку';btn.className='btn\nbtn-ghost';}else{pill.textContent='Ждёт разбора';pill.className='status-pill\nstatus-pending';btn.textContent='✓ Готово / Отправить\nкомментарий';btn.className='btn btn-success';}}async function
saveRefPatch(id,patch){const
label=document.getElementById('saveStateLabel');label.textContent='Сохраняется...';const

idx=refs.findIndex(r=>r.id===id);if(idx!==-1)refs[idx]=data.ref;label.textContent='Сохранено\n✓';return data.ref;}function scheduleSaveDraft(){const

targetId=ref.id;const
text=ref.comment;draftTimer=setTimeout(()=>saveRefPatch(targetId,{comment:text}).catch(e=>showToast(e.message)),700);}function scheduleNumSave(){const ref=refs.find(r=>r.id===activeRefId);if(!ref)return;const v=document.getElementById('numInput').value.trim();clearTimeout(numTimer);numTimer=setTimeout(()=>{saveRefPatch(ref.id,{num:v}).then(()=>{renderQuickTabs();}).catch(e=>showToast(e.message));},700);}async function
flushDraft(){if(!draftTimer||!activeRefId)return;clearTimeout(draftTimer);draftTimer=null;const

saveRefPatch(ref.id,{comment:ref.comment}).catch(()=>{});}async function
toggleComplete(){const
ref=refs.find(r=>r.id===activeRefId);if(!ref)return;clearTimeout(draftTimer);draftTimer=null;const
nextStatus=ref.status==='done'?'pending':'done';const
commentText=document.getElementById('commentInput').value;ref.comment=commentText;try{const
updated=await
saveRefPatch(ref.id,{comment:commentText,status:nextStatus});updateDetailStatusUI(updated);renderQuickTabs();if(updated.status==='done'){showToast('Референс\n#'+updated.id+' отмечен как готовый!');const
nextPending=refs.find(r=>r.status==='pending');if(nextPending)setTimeout(()=>openRef(nextPending.id),550);}}catch(err){showToast(err.message);}}function
compressImage(file,maxW,quality){return new Promise((resolve,reject)=>{const
img=new Image();const
objUrl=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(objUrl);let
w=img.width;let h=img.height;if(w>maxW){h=Math.round(h(maxW/w));w=maxW;}const
c=document.createElement('canvas');c.width=w;c.height=h;const
cctx=c.getContext('2d');cctx.fillStyle='#FFFFFF';cctx.fillRect(0,0,w,h);cctx.drawImage(img,0,0,w,h);c.toBlob(b=>b?resolve(b):reject(new
Error('Ошибка\nсжатия')),'image/jpeg',quality);};img.onerror=()=>{URL.revokeObjectURL(objUrl);reject(new
Error('Не удалось открыть фото'));};img.src=objUrl;});}async function
uploadMediaBlob(blob,name){const fd=new
FormData();fd.append('file',blob,name);const res=await
fetch('/.netlify/functions/api?media=1',{method:'POST',body:fd});const
data=await res.json();if(!res.ok)throw new Error(data.error||'Ошибка загрузки\nфото');return data.id;}async function handleFiles(event){const
ref=refs.find(r=>r.id===activeRefId);if(!ref)return;const
files=Array.from(event.target.files||[]);event.target.value='';if(!files.length)return;showToast('Загрузка\nфото...');for(const file of files){try{const compressed=await
compressImage(file,1280,0.8);const mediaId=await
uploadMediaBlob(compressed,'photo.jpg');const
nextAtt=[...(ref.attachments||[]),{id:mediaId,type:'photo'}];const updated=await
saveRefPatch(ref.id,{attachments:nextAtt});renderAttachments(updated);}catch(err){showToast(err.message);}}}function
renderAttachments(ref){const
grid=document.getElementById('attachmentsGrid');const
atts=ref.attachments||[];grid.innerHTML=atts.map((att,idx)=>`<div
class='att-item'><img src='/.netlify/functions/api?media=${escapeHtml(att.id)}'
onclick='openLightbox(this.src)' alt='' /><span
class='att-badge'>${att.type==='sketch'?'Набросок':'Фото'}</span><button
class='att-del'
onclick='removeAttachment(${idx})'>×</button></div>`).join('');}async function
removeAttachment(idx){const
ref=refs.find(r=>r.id===activeRefId);if(!ref)return;const
nextAtt=(ref.attachments||[]).filter((att,i)=>i!==idx);try{const updated=await
saveRefPatch(ref.id,{attachments:nextAtt});renderAttachments(updated);}catch(err){showToast(err.message);}}function
openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open');}function
closeLightbox(){document.getElementById('lightbox').classList.remove('open');}function
stopSpeechIfActive(){clearTimeout(recMaxTimer);if(mediaRecorder&&isRecording){try{mediaRecorder.stop();}catch(e){}}}async function toggleSpeech(){const micBtn=document.getElementById('micBtn');const
micLabel=document.getElementById('micLabel');if(isRecording&&mediaRecorder){clearTimeout(recMaxTimer);mediaRecorder.stop();return;}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){showToast('Микрофон\nнедоступен. Откройте сайт по HTTPS в Safari или\nChrome.');return;}try{audioStream=await
navigator.mediaDevices.getUserMedia({audio:true});const
preferred=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];const
supportedType=preferred.find(t=>MediaRecorder.isTypeSupported(t))||'';audioChunks=[];mediaRecorder=supportedType?new
MediaRecorder(audioStream,{mimeType:supportedType}):new
MediaRecorder(audioStream);mediaRecorder.ondataavailable=(e)=>{if(e.data&&e.data.size>0)audioChunks.push(e.data);};mediaRecorder.onstop=async()=>{isRecording=false;clearTimeout(recMaxTimer);micBtn.classList.remove('recording');if(audioStream){audioStream.getTracks().forEach(t=>t.stop());audioStream=null;}const
rawMime=(mediaRecorder.mimeType||supportedType||'audio/webm').split(';')[0];const
ext=(rawMime.includes('mp4')||rawMime.includes('m4a'))?'m4a':(rawMime.includes('ogg')?'ogg':'webm');const
audioBlob=new
Blob(audioChunks,{type:rawMime});if(audioBlob.size<800){micLabel.textContent='Голос';return;}micLabel.textContent='Расшифровка...';micBtn.disabled=true;try{const
fd=new FormData();fd.append('file',audioBlob,'voice.'+ext);const res=await
fetch('/.netlify/functions/transcribe',{method:'POST',body:fd});const data=await
res.json();if(!res.ok)throw new Error(data.error||'Ошибка\nраспознавания');if(data.text){const
textarea=document.getElementById('commentInput');const
nl=String.fromCharCode(10);const sep=textarea.value&&!textarea.value.endsWith('\n')&&!textarea.value.endsWith(nl)?' ':'';textarea.value+=sep+data.text;const
ref=refs.find(r=>r.id===activeRefId);if(ref){ref.comment=textarea.value;await
saveRefPatch(ref.id,{comment:ref.comment});}}else{showToast('Речь не распознана,\nпопробуйте ещё раз');}}catch(err){showToast('Ошибка:\n'+err.message);}finally{micBtn.disabled=false;micLabel.textContent='Голос';}};mediaRecorder.start();isRecording=true;micBtn.classList.add('recording');micLabel.textContent='Говорите...\n(Стоп)';recMaxTimer=setTimeout(()=>{if(isRecording&&mediaRecorder)mediaRecorder.stop();},150000);}catch(err){showToast('Разрешите\nдоступ к микрофону в браузере');}}function
openAddModal(){document.getElementById('addModal').classList.add('open');}function
closeAddModal(){document.getElementById('addModal').classList.remove('open');}async function addReference(){const
url=document.getElementById('newUrl').value.trim();const
ytId=extractYouTubeId(url);if(!ytId){showToast('Укажите корректную ссылку на\nYouTube или Shorts');return;}const
btn=document.getElementById('submitAddBtn');btn.disabled=true;try{const
res=await
fetch('/.netlify/functions/api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':savedPin},body:JSON.stringify({ytId,num:document.getElementById('newNum').value.trim(),title:document.getElementById('newTitle').value.trim(),folder:document.getElementById('newFolder').value.trim(),adminNote:document.getElementById('newAdminNote').value.trim()})});const
data=await res.json();if(!res.ok)throw new Error(data.error||'Ошибка\nдобавления');refs.unshift(data.ref);document.getElementById('newUrl').value='';document.getElementById('newTitle').value='';document.getElementById('newAdminNote').value='';document.getElementById('newNum').value='';closeAddModal();setFilter('pending');showToast('Добавлен\nреференс\n#'+data.ref.id);}catch(err){showToast(err.message);}finally{btn.disabled=false;}}async function deleteCurrentRef(){if(!confirm('Удалить этот референс\nбезвозвратно?'))return;try{const res=await
fetch('/.netlify/functions/api?id='+activeRefId,{method:'DELETE',headers:{'x-admin-pin':savedPin}});const
data=await res.json();if(!res.ok)throw new Error(data.error||'Ошибка\nудаления');refs=refs.filter(r=>r.id!==activeRefId);activeRefId=null;document.getElementById('ytPlayer').src='';document.getElementById('detailView').classList.add('hidden');document.getElementById('catalogView').classList.remove('hidden');renderCatalog();showToast('Удалено');}catch(err){showToast(err.message);}}const
canvas=document.getElementById('sketchCanvas');const
ctx=canvas.getContext('2d');let strokes=[];let currentStroke=null;let
drawColor='#EF4444';let bgImage=null;function
openDrawModal(){document.getElementById('drawModal').classList.add('open');strokes=[];bgImage=null;requestAnimationFrame(resizeCanvas);}function
closeDrawModal(){document.getElementById('drawModal').classList.remove('open');}function
resizeCanvas(){const rect=canvas.parentElement.getBoundingClientRect();const
dpr=window.devicePixelRatio||1;canvas.width=rect.widthdpr;canvas.height=rect.heightdpr;ctx.setTransform(dpr,0,0,dpr,0,0);redrawCanvas();}function
setColor(el){drawColor=el.dataset.color;document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));el.classList.add('active');}function
loadSketchBg(event){const
file=event.target.files&&event.target.files[0];if(!file)return;const reader=new
FileReader();reader.onload=e=>{const img=new
Image();img.onload=()=>{bgImage=img;redrawCanvas();};img.src=e.target.result;};reader.readAsDataURL(file);event.target.value='';}function
redrawCanvas(){const
rect=canvas.getBoundingClientRect();ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,rect.width,rect.height);if(bgImage){const
scale=Math.min(rect.width/bgImage.width,rect.height/bgImage.height);const
w=bgImage.widthscale;const
h=bgImage.heightscale;ctx.drawImage(bgImage,(rect.width-w)/2,(rect.height-h)/2,w,h);}ctx.lineCap='round';ctx.lineJoin='round';strokes.forEach(s=>{if(!s.points.length)return;ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);for(let
i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);ctx.stroke();});}function
getPos(e){const
rect=canvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top};}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const
p=getPos(e);currentStroke={color:drawColor,size:4,points:[p,{x:p.x+0.1,y:p.y+0.1}]};strokes.push(currentStroke);redrawCanvas();});canvas.addEventListener('pointermove',e=>{if(!currentStroke)return;currentStroke.points.push(getPos(e));redrawCanvas();});canvas.addEventListener('pointerup',()=>{currentStroke=null;});canvas.addEventListener('pointercancel',()=>{currentStroke=null;});function
undoStroke(){strokes.pop();redrawCanvas();}function
clearCanvas(){strokes=[];bgImage=null;redrawCanvas();}function
saveSketch(){const ref=refs.find(r=>r.id===activeRefId);if(!ref)return;const
btn=document.getElementById('saveSketchBtn');btn.disabled=true;canvas.toBlob(async(blob)=>{try{if(!blob)throw new Error('Ошибка рисунка');const mediaId=await
uploadMediaBlob(blob,'sketch.png');const
nextAtt=[...(ref.attachments||[]),{id:mediaId,type:'sketch'}];const
updated=await
saveRefPatch(ref.id,{attachments:nextAtt});renderAttachments(updated);closeDrawModal();showToast('Набросок\nприкреплён');}catch(err){showToast(err.message);}finally{btn.disabled=false;}},'image/png');}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!activeRefId)loadRefs(true);});
loadRefs(true);</script>
