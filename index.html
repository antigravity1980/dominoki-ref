<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dominoki — Видеореференсы</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --primary:#F6269A;--primary-btn:#F6269A;--primary-text:#FFFFFF;
  --primary-soft:rgba(246,38,154,0.13);--primary-plum:#FF79C6;
  --ring-blue:#3A4157;--bg:#0E1016;--surface:#171A23;--surface-2:#1F2432;
  --field:#12151D;--text:#ECEEF4;--muted:#98A0B0;
  --border:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.17);
  --pending:#FBBF24;--pending-bg:rgba(251,191,36,0.14);
  --done:#34D399;--done-bg:rgba(52,211,153,0.14);
  --danger:#F87171;--danger-bg:rgba(248,113,113,0.14);
  --radius:16px;--shadow:0 10px 30px rgba(0,0,0,0.35);
}
html,body{background:var(--bg);}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:
    radial-gradient(1100px 520px at 50% -12%, rgba(246,38,154,0.13), transparent 62%),
    radial-gradient(700px 420px at 100% 100%, rgba(64,74,140,0.14), transparent 60%),
    var(--bg);
  color:var(--text);line-height:1.45;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:36px;}
.header{
  position:sticky;top:0;z-index:20;
  background:rgba(14,16,22,0.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,0.07);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{display:flex;align-items:center;min-width:0;}
.brand img{height:46px;display:block;filter:drop-shadow(0 5px 14px rgba(246,38,154,0.3));}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.role-btn{
  font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;
  border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);
  cursor:pointer;transition:all .18s ease;
}
.role-btn:hover{border-color:var(--primary);color:var(--primary-plum);}
.role-btn.admin{
  background:linear-gradient(135deg,#FF4FB0,#E21B88);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(246,38,154,0.4);
}
.section{padding:16px 16px 0;}
.search-row{display:flex;gap:8px;margin-bottom:12px;}
.input{
  width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--border);
  background:var(--field);color:var(--text);font-size:15px;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.input::placeholder{color:#6C7486;}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(246,38,154,0.18);}
.btn{
  border:none;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease, box-shadow .18s ease, opacity .15s, background .15s, border-color .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:0.55;cursor:not-allowed;}
.btn svg{width:17px;height:17px;flex-shrink:0;}
.btn-primary{
  background:linear-gradient(135deg,#FF4FB0,#E21B88);color:#fff;
  box-shadow:0 6px 18px rgba(246,38,154,0.32);
}
.btn-primary:hover{box-shadow:0 9px 26px rgba(246,38,154,0.45);}
.btn-success{
  background:linear-gradient(135deg,#34D399,#10B981);color:#052E1E;
  box-shadow:0 6px 18px rgba(16,185,129,0.28);
}
.btn-ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--border-strong);background:#252B3A;}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(248,113,113,0.3);}
.filter-tabs{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--field);
  padding:5px;border-radius:14px;margin-bottom:14px;border:1px solid var(--border);
}
.filter-tab{
  border:none;background:transparent;padding:9px 4px;border-radius:10px;
  font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;
}
.filter-tab.active{
  background:linear-gradient(135deg,rgba(246,38,154,0.24),rgba(246,38,154,0.10));
  color:#FF9AD5;box-shadow:inset 0 0 0 1px rgba(246,38,154,0.35);
}
.catalog-list{display:flex;flex-direction:column;gap:12px;padding:0;}
.card{
  background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);
  padding:12px;display:flex;gap:12px;cursor:pointer;align-items:center;
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
@media (hover:hover){
  .card:hover{transform:translateY(-2px);border-color:rgba(246,38,154,0.4);box-shadow:0 10px 26px rgba(0,0,0,0.35);}
}
.card.is-done{opacity:0.6;}
.thumb-wrap{
  position:relative;width:112px;height:64px;border-radius:10px;overflow:hidden;
  flex-shrink:0;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08);
}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;}
.ref-id-badge{
  position:absolute;bottom:5px;left:5px;background:rgba(10,12,16,0.85);
  color:#fff;font-size:10px;font-weight:800;letter-spacing:0.4px;
  padding:3px 7px;border-radius:7px;border:1px solid rgba(255,255,255,0.16);
}
.card-body{flex:1;min-width:0;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px;}
.card-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.status-pill{
  font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;
  white-space:nowrap;flex-shrink:0;letter-spacing:0.2px;
}
.status-pending{background:var(--pending-bg);color:var(--pending);box-shadow:inset 0 0 0 1px rgba(251,191,36,0.3);}
.status-done{background:var(--done-bg);color:var(--done);box-shadow:inset 0 0 0 1px rgba(52,211,153,0.3);}
.card-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#detailView{padding:16px 16px 8px;display:flex;flex-direction:column;gap:14px;}
.quick-tabs{
  display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.quick-tabs::-webkit-scrollbar{display:none;}
.q-tab{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:700;
  white-space:nowrap;cursor:pointer;color:var(--muted);transition:all .15s;flex-shrink:0;
}
.q-tab.active{
  background:linear-gradient(135deg,rgba(246,38,154,0.28),rgba(246,38,154,0.12));
  border-color:rgba(246,38,154,0.5);color:#fff;
}
.q-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.q-dot.pending{background:var(--pending);box-shadow:0 0 8px rgba(251,191,36,0.6);}
.q-dot.done{background:var(--done);box-shadow:0 0 8px rgba(52,211,153,0.6);}
.ws-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.nav-back{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px 9px 13px;
  border-radius:999px;background:var(--surface-2);border:1px solid var(--border-strong);
  color:var(--text);font-size:13.5px;font-weight:700;cursor:pointer;transition:all .15s;
}
.nav-back:hover{border-color:var(--primary);color:#FF9AD5;}
.nav-back svg{width:16px;height:16px;}
.ws-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#detailIdBadge{
  background:var(--surface-2);border:1px solid var(--border-strong);color:var(--muted);
  font-size:12px;font-weight:800;letter-spacing:0.5px;padding:5px 11px;border-radius:999px;
}
.detail-title{
  margin:0;font-size:18px;font-weight:800;letter-spacing:-0.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player-box{
  position:relative;width:100%;aspect-ratio:16/9;background:#000;
  border-radius:var(--radius);overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.07);
}
.player-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.admin-note{
  background:var(--primary-soft);border-left:3px solid var(--primary);
  color:#FFC4E8;padding:12px 14px;border-radius:12px;font-size:13.5px;
}
.editor-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);
}
.editor-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:13px;font-weight:600;color:var(--muted);min-height:36px;
}
#commentInput{
  width:100%;min-height:120px;border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;background:var(--field);color:var(--text);
  font-family:inherit;font-size:15px;resize:vertical;outline:none;
  transition:border-color .15s, box-shadow .15s;line-height:1.5;
}
#commentInput::placeholder{color:#6C7486;}
#commentInput:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(246,38,154,0.18);}
.tools-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.icon-btn{
  height:44px;padding:0 15px;border-radius:14px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-size:14px;font-weight:700;
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:all .15s;
  user-select:none;text-decoration:none;
}
.icon-btn svg{width:18px;height:18px;flex-shrink:0;}
@media (hover:hover){
  .icon-btn:hover{border-color:rgba(246,38,154,0.5);color:#FF9AD5;transform:translateY(-1px);}
}
.icon-btn:disabled{opacity:0.55;cursor:not-allowed;}
.icon-btn.recording{
  background:var(--danger-bg);border-color:rgba(248,113,113,0.5);color:var(--danger);
  animation:pulse 1.1s infinite;
}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(248,113,113,0.4);}50%{opacity:0.72;box-shadow:0 0 0 7px rgba(248,113,113,0);}}
.attachments-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.att-item{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--field);}
.att-item img{width:100%;height:100%;object-fit:cover;display:block;}
.att-badge{
  position:absolute;bottom:5px;left:5px;background:rgba(10,12,16,0.85);color:#fff;
  font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;
}
.att-del{
  position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.22);background:rgba(10,12,16,0.85);color:#fff;
  font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;line-height:1;
}
.modal-backdrop{
  position:fixed;inset:0;z-index:50;background:rgba(6,7,10,0.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;
}
.modal-backdrop.open{display:flex;}
.modal-sheet{
  width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);
  border-bottom:none;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:13px;max-height:92dvh;overflow-y:auto;
  box-shadow:0 -24px 70px rgba(0,0,0,0.6);
}
.draw-modal{position:fixed;inset:0;z-index:60;background:#0B0D12;display:none;flex-direction:column;height:100dvh;}
.draw-modal.open{display:flex;}
.draw-top{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;color:#fff;gap:10px;}
.draw-title{display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:800;}
.draw-title svg{width:19px;height:19px;color:var(--primary-plum);}
.draw-close{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;
  border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.06);color:#fff;
  font-size:13.5px;font-weight:700;cursor:pointer;transition:all .15s;
}
.draw-close:hover{background:rgba(248,113,113,0.18);border-color:rgba(248,113,113,0.5);}
.draw-close svg{width:15px;height:15px;}
.canvas-wrap{
  flex:1;margin:0 12px;background:#FFFFFF;border-radius:16px;overflow:hidden;
  position:relative;box-shadow:0 18px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
}
#sketchCanvas{width:100%;height:100%;display:block;touch-action:none;}
.draw-bottom{
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.colors{display:flex;gap:10px;align-items:center;}
.color-dot{
  width:30px;height:30px;border-radius:50%;cursor:pointer;
  border:2px solid rgba(255,255,255,0.25);transition:transform .12s, border-color .12s;
}
.color-dot:hover{transform:scale(1.12);}
.color-dot.active{border-color:#fff;transform:scale(1.18);box-shadow:0 0 12px rgba(255,255,255,0.35);}
.draw-bottom .icon-btn{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.14);color:#fff;}
.draw-bottom .btn-success{background:linear-gradient(135deg,#34D399,#10B981);color:#052E1E;border-color:transparent;}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(6,7,10,0.93);display:none;align-items:center;justify-content:center;padding:16px;}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%;max-height:90dvh;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,0.7);}
.role-btn.login-active{background:linear-gradient(135deg,#34D399,#10B981);color:#052E1E;border-color:transparent;box-shadow:0 6px 18px rgba(52,211,153,0.35);}
#commentInput:disabled{opacity:0.5;cursor:not-allowed;background:#0F1219;}
.hidden{display:none!important;}
.toast{
  position:fixed;bottom:58px;left:50%;transform:translateX(-50%);
  background:#262C3A;color:#fff;padding:12px 20px;border-radius:999px;
  font-size:13.5px;font-weight:600;z-index:90;opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:86%;text-align:center;
  border:1px solid rgba(255,255,255,0.14);box-shadow:0 14px 40px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><img src="logo.png" alt="Dominoki"></div>
    <div class="header-actions">
      <button class="role-btn" id="loginBtn" onclick="toggleLogin()">Вход</button>
      <button class="btn btn-primary hidden" id="addRefBtn" onclick="openAddModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Добавить видео</button>
      <button class="btn btn-ghost hidden" id="deleteRefBtn" onclick="deleteCurrentRef()" title="Удалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Удалить</button>
    </div>
  </header>

  <div class="section" id="catalogView">
    <div class="search-row">
      <input class="input" id="searchInput" placeholder="Поиск...">
    </div>
    <div class="filter-tabs">
      <button class="filter-tab" data-filter="pending" onclick="setFilter('pending')">Ожидают <span id="cntPending">(0)</span></button>
      <button class="filter-tab" data-filter="done" onclick="setFilter('done')">Обработано <span id="cntDone">(0)</span></button>
      <button class="filter-tab" data-filter="all" onclick="setFilter('all')">Все <span id="cntAll">(0)</span></button>
    </div>
    <div id="catalogList" class="catalog-list"></div>
  </div>

  

  <div id="detailView" class="hidden">
    <div class="ws-nav">
      <button class="nav-back" onclick="goCatalog()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg> Каталог</button>
      <div class="ws-badges">
        <span id="detailIdBadge">#</span>
        <span id="detailStatusPill" class="status-pill status-pending">Ждёт разбора</span>
      </div>
    </div>
    <h2 id="detailTitle" class="detail-title"></h2>
    <div class="player-box">
      <iframe id="ytPlayer" src="" title="Видео" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div id="adminNoteBox" class="admin-note hidden"></div>
    <div class="editor-card">
      <div class="editor-head"><label class="admin-only hidden" style="display:flex;align-items:center;gap:6px;font-weight:600;">Номер <input id="numInput" class="input" style="width:96px;padding:6px 8px;" placeholder="001" oninput="scheduleNumSave()"></label><span id="saveStateLabel"></span></div>
      <textarea id="commentInput" placeholder="Комментарий / что изменить:" oninput="scheduleSaveDraft()"></textarea>
      <div class="tools-bar">
        <button class="icon-btn" id="micBtn" onclick="toggleSpeech()" title="Голос"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg> <span id="micLabel">Голос</span></button>
        <input type="file" id="photoInput" accept="image/*" onchange="handleFiles(event)" style="display:none">
        <label class="icon-btn" for="photoInput" title="Фото"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2.5"/><path d="m21 15-4.5-4.5a2 2 0 0 0-2.83 0L6 19"/></svg> Фото</label>
        <button class="icon-btn" onclick="openDrawModal()" title="Набросм"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg> Набросок</button>
        <button class="btn btn-success" id="completeBtn" onclick="toggleComplete()"> Отметить как обработанное</button>
        <button class="btn btn-ghost admin-only hidden" onclick="deleteCurrentRef()" title="Удалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Удалить референс</button>
      </div>
      <div id="attachmentsGrid" class="attachments-grid"></div>
    </div>
    <div class="quick-tabs" id="quickTabs"></div>
  </div>

  <div id="addModal" class="modal-backdrop">
    <div class="modal-sheet">
      <div style="font-weight:700;font-size:16px;margin-bottom:10px;">Новый видеореференс</div>
      <input id="newUrl" class="input" placeholder="Ссылка на YouTube / Shorts">
      <input id="newNum" class="input" placeholder="Номер (напр. 001)">
      <input id="newTitle" class="input" placeholder="Название">
      <input id="newFolder" class="input" placeholder="Папка (напр. Партия #1)">
      <input id="newAdminNote" class="input" placeholder="Заметка админа">
      <div class="tools-bar" style="margin-top:10px;">
        <button class="btn btn-ghost" onclick="closeAddModal()">Отмена</button>
        <button class="btn btn-primary" id="submitAddBtn" onclick="addReference()">Добавить в каталог</button>
      </div>
    </div>
  </div>

  <div id="drawModal" class="draw-modal">
    <div class="draw-top">
      <span class="draw-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg> Добавить рисунок</span>

w=bgImage.width*scale;const
h=bgImage.height*scale;ctx.drawImage(bgImage,(rect.width-w)/2,(rect.height-h)/2,w,h);}ctx.lineCap='round';ctx.lineJoin='round';strokes.forEach(s=>{if(!s.points.length)return;ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);for(let
i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);ctx.stroke();});}function
getPos(e){const
rect=canvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top};}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const
p=getPos(e);currentStroke={color:drawColor,size:4,points:[p,{x:p.x+0.1,y:p.y+0.1}]};strokes.push(currentStroke);redrawCanvas();});canvas.addEventListener('pointermove',e=>{if(!currentStroke)return;currentStroke.points.push(getPos(e));redrawCanvas();});canvas.addEventListener('pointerup',()=>{currentStroke=null;});canvas.addEventListener('pointercancel',()=>{currentStroke=null;});function
undoStroke(){strokes.pop();redrawCanvas();}function
clearCanvas(){strokes=[];bgImage=null;redrawCanvas();}function
saveSketch(){const ref=refs.find(r=>r.id===activeRefId);if(!ref)return;const
btn=document.getElementById('saveSketchBtn');btn.disabled=true;canvas.toBlob(async(blob)=>{try{if(!blob)throw new Error('Ошибка рисунка');const mediaId=await
uploadMediaBlob(blob,'sketch.png');const
nextAtt=[...(ref.attachments||[]),{id:mediaId,type:'sketch'}];const
updated=await
saveRefPatch(ref.id,{attachments:nextAtt});renderAttachments(updated);closeDrawModal();showToast('Набросок\nприкреплён');}catch(err){showToast(err.message);}finally{btn.disabled=false;}},'image/png');}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!activeRefId)loadRefs(true);});
if(location.pathname==='/vhod'){openPinModal('admin');}
applyLoginUI();loadRefs(true);</script>
